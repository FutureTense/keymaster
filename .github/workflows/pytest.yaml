name: Python CI

on:
  push:
    branches: [beta, main]
    paths:
      - "**.py"
      - "**.md"
      - ".agents/**"
      - "custom_components/**"
      - "tests/**"
      - "pyproject.toml"
      - "tox.ini"
      - ".pre-commit-config.yaml"
      - ".github/workflows/pytest.yaml"
  pull_request:
    branches: [beta, main]
    paths:
      - "**.py"
      - "**.md"
      - ".agents/**"
      - "custom_components/**"
      - "tests/**"
      - "pyproject.toml"
      - "tox.ini"
      - ".pre-commit-config.yaml"
      - ".github/workflows/pytest.yaml"
  schedule:
    - cron: "0 7 1-28/7 * *"

jobs:
  tests:
    needs: prek
    runs-on: ubuntu-latest
    name: Pytest
    strategy:
      matrix:
        python-version:
          - "3.14"

    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: 🛠️ Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: 📦 Install tox
        run: uv pip install --system tox tox-gh-actions
      - name: 🏃 Run tox
        run: tox
      - name: 📤 Upload coverage artifact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data
          path: coverage.xml

  prek:
    runs-on: ubuntu-latest
    name: Prek
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🛠️ Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/iron"
      - name: 📦 Install dependencies
        run: yarn install
      - name: 🔍 Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: --all-files --skip no-commit-to-branch

  coverage:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: 📥 Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-data
      - name: 📤 Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python
          files: ./coverage.xml
